name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-smoke:
    name: make all + QEMU smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install nasm and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm qemu-system-x86

      # No i686-elf cross compiler on the runner: the Makefile falls back
      # to the host gcc with -m32.
      - name: Build
        run: |
          make info
          make all

      - name: Smoke test
        run: tools/smoke.sh --no-build

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-artifacts
          path: |
            build/smoke/*.png
            build/smoke/*.log
            build/smoke/*.txt
          if-no-files-found: ignore

  stress:
    name: make all + QEMU stress test
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install nasm and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm qemu-system-x86

      - name: Build
        run: make all

      # 25 cycles of opening, typing into and closing all three programs
      - name: Stress test
        run: tools/smoke.sh --no-build --stress

      - name: Upload stress artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-artifacts
          path: |
            build/stress/*.png
            build/stress/*.log
            build/stress/*.txt
          if-no-files-found: ignore

  matrix:
    name: make all + QEMU boot matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install nasm and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm qemu-system-x86

      - name: Build
        run: make all

      # 32/64/256 MB, no data disk, 4 MB VRAM, boot from the hard disk image,
      # a data disk without GemFS or with a damaged superblock (must stay
      # byte for byte unchanged), a second boot that must write nothing
      - name: Smoke test on every machine variant
        run: tools/smoke.sh --no-build --matrix

      - name: Upload matrix artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-artifacts
          path: |
            build/matrix/*/*.png
            build/matrix/*/*.log
            build/matrix/*/*.txt
          if-no-files-found: ignore

  selftest:
    name: make selftest + QEMU self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install nasm and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm qemu-system-x86

      # Heap, pool, ELF loader, GemFS and the file syscalls, FPU state,
      # every exception a program can raise from Ring 3, and a kernel
      # stack overflow that must end in the double fault handler
      # (kernel/selftest.c); two boots on the same disks, so files
      # written on the first must be there on the second
      - name: Self-test
        run: tools/smoke.sh --selftest

      - name: Upload self-test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-artifacts
          path: |
            build/selftest-run/*.png
            build/selftest-run/*.log
            build/selftest-run/*.txt
          if-no-files-found: ignore
