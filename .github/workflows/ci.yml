name: CI

on:
  push:
  pull_request:
  merge_group:

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: "1.100.1"

jobs:
  build-and-smoke:
    name: make all + QEMU smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install nasm, QEMU and Rust
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm qemu-system-x86
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target i586-unknown-linux-gnu

      # No i686-elf cross compiler on the runner: the Makefile falls back
      # to the host gcc with -m32.
      - name: Build
        id: build
        shell: bash
        run: |
          mkdir -p build/ci
          make info
          make -j"$(nproc)" all 2>&1 | tee build/ci/build.log

      - name: Smoke test
        shell: bash
        run: tools/smoke.sh --no-build 2>&1 | tee build/ci/smoke.log

      # UTEXTEDIT.ELF with files: unsaved-changes question, save as, reopen
      # from the File Explorer, save, discard, a refused save over a program
      - name: Text editor test
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: tools/smoke.sh --no-build --editor 2>&1 | tee build/ci/editor.log

      - name: Preserve the tested boot image
        uses: actions/upload-artifact@v4
        with:
          name: tested-qemu-image
          path: build/gemos.img
          if-no-files-found: error
          retention-days: 1

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-artifacts
          path: |
            build/ci/*.log
            build/smoke/*.png
            build/smoke/*.log
            build/smoke/*.txt
            build/editor/*.png
            build/editor/*.log
            build/editor/*.txt
          if-no-files-found: ignore

  qemu-packages:
    name: Build QEMU packages
    needs: build-and-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tested-qemu-image
          path: build/release-input

      - name: Install ISO builder
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends genisoimage

      - name: Package the tested image
        shell: bash
        run: |
          version="${GITHUB_SHA:0:12}"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="$GITHUB_REF_NAME"
          fi
          python3 tools/package_qemu.py --image build/release-input/gemos.img --version "$version"

      - uses: actions/upload-artifact@v4
        with:
          name: qemu-package-candidates
          path: build/release/
          if-no-files-found: error
          retention-days: 3

  package-smoke:
    name: QEMU package (${{ matrix.platform }})
    needs: qemu-packages
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Apple Silicon
            runner: macos-15
          - platform: Windows x64
            runner: windows-2025
          - platform: Linux
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: qemu-package-candidates
          path: build/release

      - name: Install QEMU on Apple Silicon
        if: runner.os == 'macOS'
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          brew install qemu

      - name: Install QEMU on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install qemu --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Join-Path $env:ProgramFiles 'qemu') >> $env:GITHUB_PATH

      - name: Install QEMU on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86

      - name: Start the packaged launcher and check its saved data
        run: python tools/test_qemu_package.py

      - name: Boot the packaged ISO and test Explorer
        if: runner.os == 'Linux'
        shell: bash
        run: |
          iso=(build/release/*.iso)
          python tools/smoke.py --boot cdrom --image "${iso[0]}" --out build/iso-smoke \
            --explorer --expect-unchanged boot

      - name: Upload package test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ runner.os }}-logs
          path: |
            build/package-smoke/**/*.log
            build/package-smoke/**/*.png
            build/iso-smoke/*.log
            build/iso-smoke/*.png
          if-no-files-found: ignore

  stress:
    name: make all + QEMU stress test
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install nasm, QEMU and Rust
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm qemu-system-x86
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target i586-unknown-linux-gnu

      - name: Build
        shell: bash
        run: |
          mkdir -p build/ci
          make -j"$(nproc)" all 2>&1 | tee build/ci/build.log

      # 25 cycles of opening, typing into and closing all three programs
      - name: Stress test
        shell: bash
        run: tools/smoke.sh --no-build --stress 2>&1 | tee build/ci/stress.log

      - name: Upload stress artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-artifacts
          path: |
            build/ci/*.log
            build/stress/*.png
            build/stress/*.log
            build/stress/*.txt
          if-no-files-found: ignore

  explorer:
    name: Explorer (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: 1080p
            resolution: 1920x1080
            memory: 128
            vram: 16
            cpu: qemu32
            slow_writes: 0
            fpu_log: '\[FPU\] Per-task state with FXSAVE'
          - mode: legacy PC
            resolution: 1280x800
            memory: 32
            vram: 4
            cpu: pentium2,-fxsr
            slow_writes: 12
            fpu_log: '\[FPU\] Per-task state with FNSAVE'
    steps:
      - uses: actions/checkout@v4

      - name: Install nasm, QEMU and Rust
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm qemu-system-x86
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target i586-unknown-linux-gnu

      - name: Build
        shell: bash
        run: |
          mkdir -p build/ci
          make -j"$(nproc)" all 2>&1 | tee build/ci/build.log

      - name: Create and rename entries, then reboot the same disk
        shell: bash
        env:
          GEMOS_CPU: ${{ matrix.cpu }}
          GEMOS_MEMORY: ${{ matrix.memory }}
          GEMOS_VRAM: ${{ matrix.vram }}
          GEMOS_RESOLUTION: ${{ matrix.resolution }}
          GEMOS_SLOW_WRITES: ${{ matrix.slow_writes }}
          GEMOS_FPU_LOG: ${{ matrix.fpu_log }}
        run: |
          python3 tools/smoke.py --explorer --out build/explorer --timeout 300 \
            --cpu "$GEMOS_CPU" --memory "$GEMOS_MEMORY" --vga-mem "$GEMOS_VRAM" \
            --resolution "$GEMOS_RESOLUTION" --slow-writes "$GEMOS_SLOW_WRITES" \
            --expect-log "$GEMOS_FPU_LOG" 2>&1 | tee build/ci/explorer.log

      - name: Upload Explorer artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: explorer-${{ matrix.resolution }}-artifacts
          path: |
            build/ci/*.log
            build/explorer/*.png
            build/explorer/*.log
            build/explorer/registers.txt
          if-no-files-found: ignore

  matrix:
    name: make all + QEMU boot matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install nasm, QEMU and Rust
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm qemu-system-x86
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target i586-unknown-linux-gnu

      - name: Build
        shell: bash
        run: |
          mkdir -p build/ci
          make -j"$(nproc)" all 2>&1 | tee build/ci/build.log

      # 32/64/256 MB, no data disk, 4 MB VRAM, boot from the hard disk image,
      # a data disk without GemFS or with a damaged superblock (must stay
      # byte for byte unchanged), a second boot that must write nothing,
      # a disk that writes slowly
      - name: Smoke test on every machine variant
        shell: bash
        run: tools/smoke.sh --no-build --matrix 2>&1 | tee build/ci/matrix.log

      - name: Upload matrix artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-artifacts
          path: |
            build/ci/*.log
            build/matrix/*/*.png
            build/matrix/*/*.log
            build/matrix/*/*.txt
          if-no-files-found: ignore

  selftest:
    name: make selftest + QEMU self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install nasm, QEMU and Rust
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm qemu-system-x86
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target i586-unknown-linux-gnu

      - name: Build the self-test image
        shell: bash
        run: |
          mkdir -p build/ci
          make -j"$(nproc)" selftest 2>&1 | tee build/ci/build.log

      # Heap, pool, ELF loader, GemFS and the file syscalls, FPU state,
      # every exception a program can raise from Ring 3, and a kernel
      # stack overflow that must end in the double fault handler
      # (kernel/selftest.c). Also check Explorer during a slow write and
      # verify on the second boot that the files from the first survived.
      - name: Self-test
        shell: bash
        run: tools/smoke.sh --no-build --selftest 2>&1 | tee build/ci/selftest.log

      - name: Upload self-test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-artifacts
          path: |
            build/ci/*.log
            build/selftest-run/*.png
            build/selftest-run/*.log
            build/selftest-run/*.txt
          if-no-files-found: ignore

  rust-userland:
    name: Rust userland on x86 CPUs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install nasm, QEMU and Rust
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm qemu-system-x86
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target i586-unknown-linux-gnu

      - name: Build and run the Rust demo on all CPU profiles
        run: make -j"$(nproc)" test-rust

      - name: Upload the Rust program and QEMU diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-userland
          path: |
            build/rust/rustdemo.elf
            build/rust/smoke/**/*.png
            build/rust/smoke/**/*.log
            build/rust/smoke/**/*.txt
          if-no-files-found: ignore

  pr-checks:
    name: PR checks
    if: always()
    needs: [build-and-smoke, stress, explorer, matrix, selftest, package-smoke, rust-userland]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SMOKE_EDITOR_RESULT: ${{ needs.build-and-smoke.result }}
      STRESS_RESULT: ${{ needs.stress.result }}
      EXPLORER_RESULT: ${{ needs.explorer.result }}
      MATRIX_RESULT: ${{ needs.matrix.result }}
      SELFTEST_RESULT: ${{ needs.selftest.result }}
      PACKAGE_RESULT: ${{ needs.package-smoke.result }}
      RUST_RESULT: ${{ needs.rust-userland.result }}
    steps:
      - name: Report and require all QEMU suites
        shell: bash
        run: |
          {
            printf '%s\n' '### GemOS QEMU checks' '' '| Job | Result |' '| --- | --- |'
            printf '| %s | %s |\n' \
              'Smoke and editor' "$SMOKE_EDITOR_RESULT" \
              'Stress (25 cycles)' "$STRESS_RESULT" \
              'Explorer (both modes)' "$EXPLORER_RESULT" \
              'Boot matrix' "$MATRIX_RESULT" \
              'Kernel self-test' "$SELFTEST_RESULT" \
              'Launchers and bootable ISO' "$PACKAGE_RESULT" \
              'Rust userland on x86 CPUs' "$RUST_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$SMOKE_EDITOR_RESULT" = success &&
            test "$STRESS_RESULT" = success &&
            test "$EXPLORER_RESULT" = success &&
            test "$MATRIX_RESULT" = success &&
            test "$SELFTEST_RESULT" = success &&
            test "$PACKAGE_RESULT" = success &&
            test "$RUST_RESULT" = success

  publish-packages:
    name: Publish tested run artifacts
    needs: pr-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: qemu-package-candidates
          path: build/release
      - uses: actions/upload-artifact@v4
        with:
          name: GemOS-QEMU-packages
          path: build/release/
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: publish-packages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: GemOS-QEMU-packages
          path: build/release
      - name: Verify and publish the release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd build/release && sha256sum -c SHA256SUMS.txt)
          assets=(build/release/*.zip build/release/*.iso build/release/SHA256SUMS.txt)
          state=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null) || state=
          case "$state" in
            false) gh release view "$GITHUB_REF_NAME" --json url --jq .url ;;
            true)
              gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
              gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease
              ;;
            *)
              cat tools/release/notes.md > "$RUNNER_TEMP/release-notes.md"
              printf '\n[CI results](%s/%s/actions/runs/%s)\n' \
                "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$RUNNER_TEMP/release-notes.md"
              gh release create "$GITHUB_REF_NAME" --verify-tag --prerelease \
                --title "GemOS $GITHUB_REF_NAME (QEMU)" --notes-file "$RUNNER_TEMP/release-notes.md" \
                "${assets[@]}"
              ;;
          esac
